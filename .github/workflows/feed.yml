name: Roma feed

on:
  schedule:
    # 매일 오전 1회: 07:00 KST (UTC 22:00)
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore feed cache
        uses: actions/cache@v4
        with:
          path: |
            data/articles.json
            data/cache.json
            data/youtube_channels.json
          key: seriea-feed-${{ github.run_id }}
          restore-keys: |
            seriea-feed-

      - name: Check translation key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error title=OPENCODE_API_KEY missing::Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "OPENCODE_API_KEY is set (${#OPENCODE_API_KEY} characters)."

      - name: Validate translation key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python - <<'PY'
          from processor import LLM

          llm = LLM()
          print(f"Cleaned key length: {len(llm.api_key)}")
          if not llm.api_key.startswith("oc_sk_"):
              print("::error title=Invalid OPENCODE_API_KEY::The secret must start with oc_sk_ and contain only the key value.")
              raise SystemExit(1)
          reply = llm.chat("You are a connection test.", "Reply with OK.", max_tokens=5)
          print(f"API test OK: {reply[:20]}")
          PY

      - name: Fetch, translate, build
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'deepseek-v4.1-flash' }}
          OPENCODE_REASONING_EFFORT: ${{ vars.OPENCODE_REASONING_EFFORT || 'none' }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'seriea-feed/0.2 (personal non-profit Serie A fan feed)' }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY || '123' }}
        run: python pipeline.py

      - name: Show stats
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/articles.json")
          if p.exists():
              stats = json.loads(p.read_text(encoding="utf-8"))["stats"]
              print(json.dumps(stats, ensure_ascii=False, indent=2))
              pending = stats.get("pending_total", 0)
              if pending:
                  print(f"::warning title=Translation pending::{pending} article(s) were not translated. Check OPENCODE_API_KEY.")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
